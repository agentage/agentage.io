name: Release

# A merge is the release: agentage extension release --changed gives the root extension, when the repo
# differs from its last root@* tag, a date version YYYY.MDD.N, the tag root@<version>, its images and the
# records on the GitHub release. The package is private: nothing goes to npm.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Images and record of the root extension
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts && npm run verify
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y @agentage/cli@0.75.0 extension release --changed # pinned: the merge-release cli
